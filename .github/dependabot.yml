version: 2
# One grouped pull request a month for each ecosystem, into develop. Updates reach the stores with the next monthly
# release, like any other change. Qeetrix for Android is pinned in gradle.properties and fetched from source
# (scripts/fetch-qeetrix.sh), so it is raised by hand.
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
